name: Daily Standings Scrape

on:
  # Run at 6:00 AM UTC (after most games finish), then again a few times later
  # in the day. HNA's WAF intermittently challenges requests from GitHub's
  # runners; the scraper skips snapshots that already exist for today, so the
  # later runs are no-ops on good days and retry only what's missing otherwise.
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 12 * * *"
    - cron: "0 18 * * *"
    - cron: "0 23 * * *"

  # Allow manual trigger for testing
  workflow_dispatch:

permissions:
  contents: write

# Never let two scrapes race to push snapshot commits.
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run scraper
        id: scrape
        # Keep going on failure so any datasets that did succeed still get
        # committed; the job is marked failed at the end.
        continue-on-error: true
        run: yarn scrape

      - name: Check for changes
        id: changes
        run: |
          if [[ -n $(git status --porcelain data/) ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          git commit -m "📊 Update standings snapshot for $(date +%Y-%m-%d)"
          git push

      - name: Fail if scraper failed
        if: steps.scrape.outcome == 'failure'
        run: |
          echo "::error::Scraper failed for at least one dataset (see 'Run scraper' logs). A later scheduled run will retry."
          exit 1
